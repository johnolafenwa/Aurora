[workspace]
members = ["crates/aura-compiler", "crates/aura"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.95"
version = "0.3.3"

# Native cache hits hash large linked artifacts on every use. Keep the SHA-256
# implementation optimized in development builds so integrity verification
# does not cost more than the compile/link work the cache avoids.
[profile.dev.package.sha2]
opt-level = 3

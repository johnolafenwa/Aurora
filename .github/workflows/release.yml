name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional commit, branch, or tag to build; defaults to release_tag'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Release identity used in artifact names, such as v0.3.3-preview'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release after all artifacts pass (manual opt-in)'
        required: true
        default: false
        type: boolean
      publish_extension:
        description: 'Publish the VSIX to configured extension marketplaces'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  release_identity:
    name: Resolve immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      implementation_commit: ${{ steps.source.outputs.implementation_commit }}
      extension_version: ${{ steps.source.outputs.extension_version }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.release_tag) || github.ref }}

      - name: Validate release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 2
          fi

      - name: Resolve immutable source commit
        id: source
        shell: bash
        run: |
          echo "implementation_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          extension_version="$(python3 -c 'import json; print(json.load(open("tools/vscode-aura/package.json"))["version"])')"
          if [[ ! "$extension_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid extension version: $extension_version" >&2
            exit 2
          fi
          echo "extension_version=$extension_version" >> "$GITHUB_OUTPUT"

      - name: Confirm publish tag identifies built source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          source_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$source_commit" != "$tag_commit" ]]; then
            echo "refusing to publish: source commit $source_commit does not match $RELEASE_TAG commit $tag_commit" >&2
            exit 2
          fi

  cli:
    name: CLI (${{ matrix.name }})
    needs: release_identity
    if: ${{ github.event_name == 'push' || inputs.publish || !inputs.publish_extension }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            archive: aura-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}-x86_64-unknown-linux-gnu
          - name: macos-x64
            os: macos-15-intel
            archive: aura-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}-x86_64-apple-darwin
          - name: macos-arm64
            os: macos-15
            archive: aura-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release_identity.outputs.implementation_commit }}

      - name: Validate release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 2
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.95.0

      - name: Build release CLI
        env:
          AURA_BUILD_COMMIT: ${{ needs.release_identity.outputs.implementation_commit }}
          AURA_BUILD_CHANNEL: preview
        run: cargo build -p aura --release --locked

      - name: Package CLI
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: scripts/package-cli.sh "$ARCHIVE_NAME"

      - name: Smoke test packaged CLI outside the source tree
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: scripts/smoke-cli-archive.sh "$ARCHIVE_NAME.tar.gz"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  tools:
    name: VS Code extension and docs
    needs: release_identity
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.publish ||
        !inputs.publish_extension ||
        inputs.source_ref != ''
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release_identity.outputs.implementation_commit }}

      - name: Validate release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 2
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve documentation implementation commit
        id: release-metadata
        shell: bash
        run: echo "implementation_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package VS Code extension
        run: npm run package:extension

      - name: Build docs
        env:
          VITEPRESS_BASE: /Aura/
          AURA_DOCS_COMMIT: ${{ steps.release-metadata.outputs.implementation_commit }}
        run: npm run docs:build

      - name: Package docs
        shell: bash
        env:
          DOCS_ARCHIVE_NAME: aura-docs-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}.tar.gz
        run: tar -czf "$DOCS_ARCHIVE_NAME" -C docs/.vitepress/dist .

      - name: Upload VS Code extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aura-language-vsix
          path: tools/vscode-aura/aura-language.vsix
          if-no-files-found: error

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aura-docs
          path: aura-docs-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [release_identity, cli, tools]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release-assets
        run: |
          mapfile -d '' assets < <(
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
              LC_ALL=C sort -z
          )
          if (( ${#assets[@]} == 0 )); then
            echo "no release assets were downloaded" >&2
            exit 2
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ needs.release_identity.outputs.implementation_commit }}
          generate_release_notes: true
          prerelease: true
          files: release-assets/*

  publish-extension:
    name: Publish VS Code extension
    needs: [release_identity, tools, publish]
    if: >-
      ${{
        always() &&
        needs.release_identity.result == 'success' &&
        (
          (
            needs.tools.result == 'success' &&
            (
              needs.publish.result == 'success' ||
              (
                github.event_name == 'workflow_dispatch' &&
                inputs.publish_extension &&
                needs.publish.result == 'skipped'
              )
            )
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.publish_extension &&
            needs.tools.result == 'skipped' &&
            needs.publish.result == 'skipped'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      VSIX_PATH: extension-artifact/aura-language.vsix
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_EXTENSION_VERSION: ${{ needs.release_identity.outputs.extension_version }}

    steps:
      - name: Confirm existing GitHub Release
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            inputs.publish_extension &&
            needs.tools.result == 'skipped' &&
            needs.publish.result == 'skipped'
          }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Download VS Code extension
        if: ${{ needs.tools.result == 'success' }}
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: aura-language-vsix
          path: extension-artifact

      - name: Download VSIX from existing GitHub Release
        if: ${{ needs.tools.result == 'skipped' }}
        shell: bash
        run: |
          mkdir -p extension-artifact
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern aura-language.vsix --dir extension-artifact

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0

      - name: Validate VSIX Marketplace identity
        shell: bash
        run: |
          expected_version="$EXPECTED_EXTENSION_VERSION"
          node - "$VSIX_PATH" "$expected_version" <<'NODE'
          const { execFileSync } = require("node:child_process");
          const [vsixPath, expectedVersion] = process.argv.slice(2);
          const manifest = JSON.parse(
            execFileSync("unzip", ["-p", vsixPath, "extension/package.json"], {
              encoding: "utf8"
            })
          );
          const identity = `${manifest.publisher}.${manifest.name}`;
          if (identity !== "JohnOlafenwa.vscode-aura-lang") {
            throw new Error(`unexpected VSIX identity: ${identity}`);
          }
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) {
            throw new Error(`Marketplace version must be plain x.y.z: ${manifest.version}`);
          }
          if (manifest.version !== expectedVersion) {
            throw new Error(
              `VSIX version ${manifest.version} does not match release ${expectedVersion}`
            );
          }
          console.log(`${identity} ${manifest.version}`);
          NODE

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        shell: bash
        run: npx @vscode/vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"

      - name: Skip Visual Studio Marketplace publish
        if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT is not configured; skipping Visual Studio Marketplace publish."

      - name: Publish to Open VSX
        if: env.OVSX_TOKEN != ''
        shell: bash
        run: npx ovsx publish "$VSIX_PATH" -p "$OVSX_TOKEN"

      - name: Skip Open VSX publish
        if: env.OVSX_TOKEN == ''
        run: echo "::notice::OVSX_TOKEN is not configured; skipping Open VSX publish."
